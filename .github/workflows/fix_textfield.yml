name: Fix payment dialog text field

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Fix source
        shell: python
        run: |
          from pathlib import Path
          path = Path('lib/presentation/debts/debts_layout.dart')
          text = path.read_text()
          old = '''            TextField(\n              controller: _controller,\n              keyboardType: const TextInputType.numberWithOptions(decimal: true),\n              onTap: _showKeypad,\n              onChanged: (_) => setState(() {}),\n                decoration: const InputDecoration(\n                  labelText: 'Efectivo recibido',\n                  prefixText: '\\$ ',\n                  prefixIcon: Icon(Icons.payments_outlined, size: 19),\n                ),\n              ),\n            ),'''
          new = '''            TextField(\n              controller: _controller,\n              keyboardType: const TextInputType.numberWithOptions(decimal: true),\n              onTap: _showKeypad,\n              onChanged: (_) => setState(() {}),\n              decoration: const InputDecoration(\n                labelText: 'Efectivo recibido',\n                prefixText: '\\$ ',\n                prefixIcon: Icon(Icons.payments_outlined, size: 19),\n              ),\n            ),'''
          if old not in text:
              raise SystemExit('bad text field block not found')
          path.write_text(text.replace(old, new, 1))
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "stellar-pos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/presentation/debts/debts_layout.dart
          git rm .github/workflows/fix_textfield.yml
          git commit -m "fix: repair payment dialog text field"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
