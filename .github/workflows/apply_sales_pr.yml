name: Apply sales settings PR changes

on:
  pull_request_target:
    types: [opened]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Save trusted integration script
        run: cp tools/apply_sales_settings.py /tmp/apply_sales_settings.py
      - name: Checkout PR branch
        run: |
          git fetch origin "${{ github.head_ref }}"
          git checkout -B "${{ github.head_ref }}" "origin/${{ github.head_ref }}"
      - name: Apply changes
        run: python3 /tmp/apply_sales_settings.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib .github tools
          git commit -m "feat: add sales history and general settings"
          git push origin "HEAD:${{ github.head_ref }}"

# trigger integration
