name: One-time UI fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, 'chore: run ui fixes')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply UI fixes
        shell: python
        run: |
          from pathlib import Path

          panel = Path('lib/presentation/dashboard/widgets/sales_summary_panel.dart')
          text = panel.read_text()

          old = '''          if (isCredit) ...[\n            Row(\n              crossAxisAlignment: CrossAxisAlignment.center,\n              children: [\n                Expanded(child: _buildDebtorSelector()),\n                const SizedBox(width: 7),\n                _buildCreditAmountInput(),\n              ],\n            ),\n            const SizedBox(height: 6),\n          ],'''
          new = '''          if (isCredit) ...[\n            _buildDebtorSelector(),\n            const SizedBox(height: 6),\n          ],'''
          if old not in text:
              raise SystemExit('sales panel: debtor row pattern not found')
          text = text.replace(old, new, 1)

          old = '''          if (isCredit) ...[\n            const SizedBox(height: 6),\n            _buildCreditInfoLine(),\n          ],'''
          new = '''          if (isCredit) ...[\n            const SizedBox(height: 6),\n            Row(\n              crossAxisAlignment: CrossAxisAlignment.center,\n              children: [\n                const Expanded(\n                  child: Text('Abonado', style: AppTextStyles.ticketLabel),\n                ),\n                _buildCompactInput(\n                  controller: cashReceivedController,\n                  width: 82,\n                  prefix: '\\$ ',\n                  hint: '0.00',\n                  onChanged: onCashReceivedChanged,\n                ),\n              ],\n            ),\n          ],'''
          if old not in text:
              raise SystemExit('sales panel: credit info pattern not found')
          text = text.replace(old, new, 1)

          old = '''          Row(\n            crossAxisAlignment: CrossAxisAlignment.center,\n            children: [\n              const Expanded(\n                child: Text('Total', style: AppTextStyles.totalLabel),\n              ),\n              Text(\n                '\\$${total.toStringAsFixed(2)}',\n                style: AppTextStyles.totalValue.copyWith(fontSize: 18),\n              ),\n            ],\n          ),'''
          new = '''          Row(\n            crossAxisAlignment: CrossAxisAlignment.center,\n            children: [\n              const Expanded(\n                child: Text('Total', style: AppTextStyles.totalLabel),\n              ),\n              Text(\n                '\\$${_displayTotal.toStringAsFixed(2)}',\n                style: AppTextStyles.totalValue.copyWith(fontSize: 18),\n              ),\n            ],\n          ),'''
          if old not in text:
              raise SystemExit('sales panel: total row pattern not found')
          text = text.replace(old, new, 1)

          marker = '''  Widget _buildCreditAmountInput() {'''
          helper = '''  double get _displayTotal {\n    if (selectedPaymentMethod != AppPaymentMethods.credit) return total;\n    final received = double.tryParse(cashReceivedController.text.replaceAll(',', '.')) ?? 0;\n    final applied = received.clamp(0, total).toDouble();\n    return (total - applied).clamp(0, double.infinity).toDouble();\n  }\n\n'''
          if marker not in text:
              raise SystemExit('sales panel: credit helper marker not found')
          text = text.replace(marker, helper + marker, 1)

          start = text.find('  Widget _buildCreditAmountInput() {')
          end = text.find('  String get _paymentMethodLabel', start)
          if start < 0 or end < 0:
              raise SystemExit('sales panel: old credit helper block not found')
          text = text[:start] + text[end:]

          panel.write_text(text)

          dashboard = Path('lib/presentation/dashboard/main_dashboard_layout.dart')
          text = dashboard.read_text()
          old = '''                Positioned(\n                  left: 22,\n                  right: 22,\n                  bottom: 12,\n                  height: 36,\n                  child: Material(\n                    color: Colors.transparent,\n                    child: InkWell(onTap: _createSale, borderRadius: BorderRadius.circular(8), child: const SizedBox.expand()),\n                  ),\n                ),\n'''
          if old not in text:
              raise SystemExit('dashboard: duplicate create-sale overlay not found')
          text = text.replace(old, '', 1)
          dashboard.write_text(text)

          debts = Path('lib/presentation/debts/debts_layout.dart')
          text = debts.read_text()

          old = '''      builder: (_) => Dialog(\n        backgroundColor: AppColors.cardBackground,\n        shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(18)),\n        child: _PaymentDialog(clientName: clientName, debt: debt),\n      ),'''
          new = '''      builder: (_) => Dialog(\n        backgroundColor: AppColors.cardBackground,\n        insetPadding: const EdgeInsets.symmetric(horizontal: 24, vertical: 24),\n        shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(18)),\n        child: ConstrainedBox(\n          constraints: const BoxConstraints(maxWidth: 620),\n          child: _PaymentDialog(clientName: clientName, debt: debt),\n        ),\n      ),'''
          if old not in text:
              raise SystemExit('debts: dialog width pattern not found')
          text = text.replace(old, new, 1)

          old = '''  final GlobalKey _fieldKey = GlobalKey();\n  final Object _keypadGroup = Object();'''
          new = '''  final GlobalKey _dialogKey = GlobalKey();\n  final Object _keypadGroup = Object();'''
          if old not in text:
              raise SystemExit('debts: field key pattern not found')
          text = text.replace(old, new, 1)

          old = '''  void _showKeypad() {\n    SystemChannels.textInput.invokeMethod<void>('TextInput.hide');\n    WidgetsBinding.instance.addPostFrameCallback((_) {'''
          new = '''  void _showKeypad() {\n    WidgetsBinding.instance.addPostFrameCallback((_) {'''
          if old not in text:
              raise SystemExit('debts: keypad hide pattern not found')
          text = text.replace(old, new, 1)

          old = '''  void _updateKeypadPosition() {\n    final renderObject = _fieldKey.currentContext?.findRenderObject();\n    if (renderObject is! RenderBox || !renderObject.hasSize) return;\n    final topLeft = renderObject.localToGlobal(Offset.zero);\n    final size = renderObject.size;\n    final screen = MediaQuery.sizeOf(context);\n    final desiredLeft = topLeft.dx;\n    final desiredTop = topLeft.dy + size.height + 8;\n    final maxLeft = screen.width - NumericKeypad.width - 8;\n    final maxTop = screen.height - NumericKeypad.height - 8;\n    _keypadPosition = Offset(\n      desiredLeft.clamp(8, maxLeft < 8 ? 8 : maxLeft),\n      desiredTop.clamp(8, maxTop < 8 ? 8 : maxTop),\n    );\n  }'''
          new = '''  void _updateKeypadPosition() {\n    final renderObject = _dialogKey.currentContext?.findRenderObject();\n    if (renderObject is! RenderBox || !renderObject.hasSize) return;\n    final topLeft = renderObject.localToGlobal(Offset.zero);\n    final size = renderObject.size;\n    final screen = MediaQuery.sizeOf(context);\n    final rightLeft = topLeft.dx + size.width + 8;\n    final leftLeft = topLeft.dx - NumericKeypad.width - 8;\n    final centeredTop = topLeft.dy + (size.height - NumericKeypad.height) / 2;\n    final maxLeft = screen.width - NumericKeypad.width - 8;\n    final maxTop = screen.height - NumericKeypad.height - 8;\n\n    double left;\n    double top = centeredTop;\n    if (rightLeft + NumericKeypad.width <= screen.width - 8) {\n      left = rightLeft;\n    } else if (leftLeft >= 8) {\n      left = leftLeft;\n    } else {\n      left = rightLeft.clamp(8, maxLeft < 8 ? 8 : maxLeft);\n      top = topLeft.dy + size.height + 8;\n    }\n\n    _keypadPosition = Offset(\n      left.clamp(8, maxLeft < 8 ? 8 : maxLeft),\n      top.clamp(8, maxTop < 8 ? 8 : maxTop),\n    );\n  }'''
          if old not in text:
              raise SystemExit('debts: keypad position pattern not found')
          text = text.replace(old, new, 1)

          old = '''      child: Padding(\n        padding: const EdgeInsets.fromLTRB(20, 18, 20, 16),'''
          new = '''      child: Padding(\n        key: _dialogKey,\n        padding: const EdgeInsets.fromLTRB(20, 18, 20, 16),'''
          if old not in text:
              raise SystemExit('debts: dialog key placement pattern not found')
          text = text.replace(old, new, 1)

          old = '''            Container(\n              key: _fieldKey,\n              child: TextField(\n                controller: _controller,\n                readOnly: true,\n                onTap: _showKeypad,'''
          new = '''            TextField(\n              controller: _controller,\n              keyboardType: const TextInputType.numberWithOptions(decimal: true),\n              onTap: _showKeypad,\n              onChanged: (_) => setState(() {}),'''
          if old not in text:
              raise SystemExit('debts: editable payment field pattern not found')
          text = text.replace(old, new, 1)

          debts.write_text(text)

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "stellar-pos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/presentation/dashboard/widgets/sales_summary_panel.dart lib/presentation/dashboard/main_dashboard_layout.dart lib/presentation/debts/debts_layout.dart
          git commit -m "fix: refine credit payment and debt keypad UI"
          git push origin main
