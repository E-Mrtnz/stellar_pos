name: Temporary Dart Autofix

on:
  push:
    branches:
      - feature/cloud-storage

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cloud-storage
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: dart fix --apply
      - run: dart format lib test
      - run: flutter analyze

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No autofix changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "fix: apply Dart analyzer autofixes"
          git push origin HEAD:feature/cloud-storage
