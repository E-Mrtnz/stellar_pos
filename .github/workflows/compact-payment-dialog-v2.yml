name: Compact payment dialog v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  compact-dialog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make payment dialog narrower
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/presentation/debts/debts_layout.dart')
          text = path.read_text()
          old = 'constraints: const BoxConstraints(maxWidth: 620),'
          new = 'constraints: const BoxConstraints(maxWidth: 440),'
          if old not in text:
              raise SystemExit('Expected payment dialog width declaration was not found.')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/presentation/debts/debts_layout.dart
          git commit -m "Compact payment dialog [skip ci]"
          git push
