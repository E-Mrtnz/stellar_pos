name: Apply final UI refinements

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply refinements
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # Purchases: keep the table header visible even when there are no records.
          p = Path('lib/presentation/purchases/purchases_layout_legacy.dart')
          s = p.read_text()
          old = "          if (purchases.isNotEmpty) ...[\n"
          if old in s:
              s = s.replace(old, "          ...[\n", 1)
          p.write_text(s)

          # Inventory: make both inventory actions use the same raised button surface.
          p = Path('lib/presentation/Inventory/inventory_layout_legacy.dart')
          s = p.read_text()
          old = '''          OutlinedButton.icon(\n            onPressed: _isImporting || _isExporting ? null : _importInventory,\n            style: buttonStyle,\n            icon: _isImporting\n                ? const SizedBox(width: 16, height: 16, child: CircularProgressIndicator(strokeWidth: 2))\n                : const Icon(Icons.upload_file_outlined, size: 18),\n            label: const Text('Subir inventario'),\n          ),'''
          new = '''          _InventoryActionButton(\n            label: 'Subir inventario',\n            icon: Icons.upload_file_outlined,\n            loading: _isImporting,\n            enabled: !_isImporting && !_isExporting,\n            onPressed: _importInventory,\n          ),'''
          if old in s:
              s = s.replace(old, new, 1)
          # Add the shared action widget before the inventory table helper.
          marker = "  Widget _buildInventoryTable(List<Map<String, dynamic>> products) {\n"
          widget = '''  Widget _buildInventoryTable(List<Map<String, dynamic>> products) {\n'''
          if 'class _InventoryActionButton extends StatelessWidget' not in s:
              helper = '''class _InventoryActionButton extends StatelessWidget {\n  final String label;\n  final IconData icon;\n  final bool loading;\n  final bool enabled;\n  final VoidCallback onPressed;\n\n  const _InventoryActionButton({\n    required this.label,\n    required this.icon,\n    required this.loading,\n    required this.enabled,\n    required this.onPressed,\n  });\n\n  @override\n  Widget build(BuildContext context) {\n    return Material(\n      color: AppColors.cardBackground,\n      borderRadius: BorderRadius.circular(8),\n      child: InkWell(\n        onTap: enabled ? onPressed : null,\n        borderRadius: BorderRadius.circular(8),\n        child: Container(\n          padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 11),\n          decoration: BoxDecoration(\n            borderRadius: BorderRadius.circular(8),\n            border: Border.all(color: AppColors.border),\n            boxShadow: const [\n              BoxShadow(color: AppColors.shadowColor, blurRadius: 6, offset: Offset(0, 2)),\n            ],\n          ),\n          child: Row(\n            mainAxisSize: MainAxisSize.min,\n            children: [\n              loading\n                  ? const SizedBox(width: 16, height: 16, child: CircularProgressIndicator(strokeWidth: 2))\n                  : Icon(icon, size: 18, color: AppColors.textPrimary),\n              const SizedBox(width: 8),\n              Text(label, style: const TextStyle(fontSize: 13, fontWeight: FontWeight.w600, color: AppColors.textPrimary)),\n            ],\n          ),\n        ),\n      ),\n    );\n  }\n}\n\n'''
              s = s.replace(marker, helper + marker, 1)
          p.write_text(s)

          # Printer settings: expose only the printer content to the outer settings shell.
          p = Path('lib/presentation/settings/printer_settings_layout_legacy.dart')
          s = p.read_text()
          s = s.replace('class _PrinterSettingsContent extends StatefulWidget {', 'class PrinterSettingsContent extends StatefulWidget {', 1)
          s = s.replace('const _PrinterSettingsContent();', 'const PrinterSettingsContent({super.key});', 1)
          s = s.replace('State<_PrinterSettingsContent> createState() => _PrinterSettingsContentState();', 'State<PrinterSettingsContent> createState() => _PrinterSettingsContentState();', 1)
          s = s.replace('class _PrinterSettingsContentState extends State<_PrinterSettingsContent> {', 'class _PrinterSettingsContentState extends State<PrinterSettingsContent> {', 1)
          p.write_text(s)

          p = Path('lib/presentation/settings/printer_settings_layout.dart')
          s = p.read_text()
          start = s.index('class _PrinterContent extends StatelessWidget {')
          s = s[:start] + '''class _PrinterContent extends StatelessWidget {\n  const _PrinterContent();\n\n  @override\n  Widget build(BuildContext context) {\n    return const legacy.PrinterSettingsContent();\n  }\n}\n'''
          p.write_text(s)

          # Remove the now-unused styling import from the wrapper if analyzer flags it.
          s = p.read_text()
          s = s.replace("import 'package:stellar_pos/presentation/widgets/settings_toggle_tile.dart';\n", '')
          p.write_text(s)
          PY

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/presentation/purchases/purchases_layout_legacy.dart lib/presentation/Inventory/inventory_layout_legacy.dart lib/presentation/settings/printer_settings_layout.dart lib/presentation/settings/printer_settings_layout_legacy.dart
          git add -u .github/workflows/fix_ui_final.yml
          git rm .github/workflows/fix_ui_final.yml
          git commit -m "fix: finalize purchases inventory and printer UI" || exit 0
          git push
