name: Apply sales operation UI changes

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/sales-operations

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Apply final implementation
        run: |
          python tool/patch_finalize_script.py
          python tool/finalize_sales_operation_flow.py
      - name: Format and analyze
        run: |
          dart format lib/presentation/dashboard/main_dashboard_layout.dart lib/presentation/dashboard/widgets/sales_summary_panel.dart lib/presentation/dashboard/widgets/sales_summary_with_keypad.dart lib/presentation/dashboard/widgets/sale_detail_dialog.dart lib/core/providers/sales_provider.dart
          dart analyze lib/presentation/dashboard/main_dashboard_layout.dart lib/presentation/dashboard/widgets/sales_summary_panel.dart lib/presentation/dashboard/widgets/sales_summary_with_keypad.dart lib/presentation/dashboard/widgets/sale_detail_dialog.dart lib/core/providers/sales_provider.dart
      - name: Commit final implementation and remove temporary tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f tool/finalize_sales_operation_flow.py tool/patch_finalize_script.py tool/implement_sales_operations_ui.py .github/workflows/implement-sales-operations-ui.yml implementation_error.log
          git add -A
          git commit -m 'feat(sales): unify return and change POS flow'
          git push origin HEAD:feature/sales-operations
