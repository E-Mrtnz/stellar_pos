name: Apply final UI fixes

on:
  push:
    paths:
      - '.github/workflows/fix_ui_and_electronic.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          # 1) Restore the dedicated electronic-balance management UI that was
          # replaced by the sales-history wrapper, then add a sales-history action.
          electronic = 'lib/presentation/electronic_balance/electronic_balance_layout.dart'
          old = subprocess.check_output([
              'git', 'show',
              'fc26c30a9148a8a7f5820f2b49aa599a80a3c16e:' + electronic,
          ], text=True)
          s = old

          s = s.replace(
              '                        onSale: () => _sale(context, account),\n                        onEdit:',
              '                        onSale: () => _sale(context, account),\n                        onHistory: () => _history(context, account),\n                        onEdit:',
              1,
          )
          s = s.replace(
              "  Future<void> _delete(BuildContext context, ElectronicBalanceAccount account) async {",
              "  Future<void> _history(BuildContext context, ElectronicBalanceAccount account) => showDialog<void>(\n        context: context,\n        builder: (_) => _BalanceSalesHistoryDialog(account: account),\n      );\n\n  Future<void> _delete(BuildContext context, ElectronicBalanceAccount account) async {",
              1,
          )
          s = s.replace(
              '  final VoidCallback onSale;\n  final VoidCallback onEdit;',
              '  final VoidCallback onSale;\n  final VoidCallback onHistory;\n  final VoidCallback onEdit;',
              1,
          )
          s = s.replace(
              'const _BalanceAccountCard({required this.account, required this.sold, required this.profit, required this.onPurchase, required this.onSale, required this.onEdit, required this.onDelete});',
              'const _BalanceAccountCard({required this.account, required this.sold, required this.profit, required this.onPurchase, required this.onSale, required this.onHistory, required this.onEdit, required this.onDelete});',
              1,
          )
          s = s.replace(
              '              IconButton(onPressed: onEdit, icon: const Icon(Icons.edit_outlined)),',
              "              IconButton(tooltip: 'Historial de ventas', onPressed: onHistory, icon: const Icon(Icons.receipt_long_outlined)),\n              IconButton(onPressed: onEdit, icon: const Icon(Icons.edit_outlined)),",
              1,
          )
          history = r'''

class _BalanceSalesHistoryDialog extends StatelessWidget {
  final ElectronicBalanceAccount account;

  const _BalanceSalesHistoryDialog({required this.account});

  @override
  Widget build(BuildContext context) {
    final transactions = context
        .watch<ElectronicBalanceProvider>()
        .transactionsFor(account.id)
        .where((transaction) => transaction.type == ElectronicBalanceTransactionType.sale)
        .toList();

    return Dialog(
      child: ConstrainedBox(
        constraints: const BoxConstraints(maxWidth: 760, maxHeight: 620),
        child: Padding(
          padding: const EdgeInsets.all(18),
          child: Column(
            children: [
              Row(
                children: [
                  const Icon(Icons.receipt_long_outlined, color: AppColors.primary),
                  const SizedBox(width: 8),
                  Expanded(
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        const Text('Historial de ventas de saldo', style: AppTextStyles.sectionTitle),
                        Text(account.companyName, style: const TextStyle(fontSize: 11, color: AppColors.textSecondary)),
                      ],
                    ),
                  ),
                  IconButton(onPressed: () => Navigator.pop(context), icon: const Icon(Icons.close)),
                ],
              ),
              const SizedBox(height: 12),
              if (transactions.isEmpty)
                const Expanded(
                  child: Center(
                    child: Text('No hay ventas de saldo registradas.', style: TextStyle(fontSize: 13, color: AppColors.textSecondary)),
                  ),
                )
              else
                Expanded(
                  child: Container(
                    decoration: BoxDecoration(
                      color: AppColors.cardBackground,
                      borderRadius: BorderRadius.circular(12),
                      border: Border.all(color: AppColors.border),
                    ),
                    child: Column(
                      children: [
                        Container(
                          padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 10),
                          decoration: const BoxDecoration(
                            color: AppColors.inputBackground,
                            border: Border(bottom: BorderSide(color: AppColors.border)),
                          ),
                          child: const Row(
                            children: [
                              SizedBox(width: 92, child: Text('Fecha', style: AppTextStyles.ticketLabel)),
                              SizedBox(width: 88, child: Text('Categoría', style: AppTextStyles.ticketLabel)),
                              Expanded(child: Text('Detalle', style: AppTextStyles.ticketLabel)),
                              SizedBox(width: 85, child: Text('Monto', textAlign: TextAlign.right, style: AppTextStyles.ticketLabel)),
                              SizedBox(width: 85, child: Text('Ganancia', textAlign: TextAlign.right, style: AppTextStyles.ticketLabel)),
                            ],
                          ),
                        ),
                        Expanded(
                          child: ListView.separated(
                            itemCount: transactions.length,
                            separatorBuilder: (_, __) => const Divider(height: 1, color: AppColors.border),
                            itemBuilder: (_, index) {
                              final transaction = transactions[index];
                              final date = '${transaction.createdAt.day.toString().padLeft(2, '0')}/${transaction.createdAt.month.toString().padLeft(2, '0')} ${transaction.createdAt.hour.toString().padLeft(2, '0')}:${transaction.createdAt.minute.toString().padLeft(2, '0')}';
                              return Padding(
                                padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 10),
                                child: Row(
                                  children: [
                                    SizedBox(width: 92, child: Text(date, style: const TextStyle(fontSize: 10))),
                                    SizedBox(width: 88, child: Text(transaction.category, style: const TextStyle(fontSize: 10))),
                                    Expanded(child: Text(transaction.description.isEmpty ? 'Venta de saldo' : transaction.description, style: const TextStyle(fontSize: 10))),
                                    SizedBox(width: 85, child: Text('\$${transaction.amount.toStringAsFixed(2)}', textAlign: TextAlign.right, style: const TextStyle(fontSize: 10, fontWeight: FontWeight.w700))),
                                    SizedBox(width: 85, child: Text('\$${transaction.profit.toStringAsFixed(2)}', textAlign: TextAlign.right, style: const TextStyle(fontSize: 10, fontWeight: FontWeight.w700, color: AppColors.successGreen))),
                                  ],
                                ),
                              );
                            },
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
            ],
          ),
        ),
      ),
    );
  }
}
'''
          s = s.rstrip() + history
          write(electronic, s)

          # 2) Sales: add a sales-source filter (all/products/electronic) and
          # make popup controls look like real buttons instead of disabled fields.
          path = 'lib/presentation/sales/sales_layout.dart'
          s = read(path)
          s = s.replace(
              'enum _SalesPaymentFilter { all, cash, card, transfer, credit }',
              'enum _SalesPaymentFilter { all, cash, card, transfer, credit }\nenum _SalesTypeFilter { all, products, electronic }',
              1,
          )
          s = s.replace(
              '  _SalesPaymentFilter _paymentFilter = _SalesPaymentFilter.all;\n',
              '  _SalesPaymentFilter _paymentFilter = _SalesPaymentFilter.all;\n  _SalesTypeFilter _typeFilter = _SalesTypeFilter.all;\n',
              1,
          )
          s = s.replace(
              '      if (!_paymentMatches(sale)) return false;\n',
              '      if (!_paymentMatches(sale)) return false;\n      if (!_typeMatches(sale)) return false;\n',
              1,
          )
          marker = '  Map<String, double> _paidBySale('
          type_method = r'''
  bool _typeMatches(SaleRecord sale) {
    final hasElectronic = sale.items.any((item) => item.isElectronicBalance);
    final hasProducts = sale.items.any((item) => !item.isElectronicBalance);
    switch (_typeFilter) {
      case _SalesTypeFilter.all:
        return true;
      case _SalesTypeFilter.products:
        return hasProducts;
      case _SalesTypeFilter.electronic:
        return hasElectronic;
    }
  }

'''
          if marker not in s:
              raise SystemExit('sales type insertion marker not found')
          s = s.replace(marker, type_method + marker, 1)

          old_period_child = "        child: OutlinedButton.icon(onPressed: null, icon: const Icon(Icons.tune_outlined, size: 17), label: Text(_periodLabel())),"
          new_period_child = "        child: _menuSurface(Icons.tune_outlined, _periodLabel()),"
          if old_period_child not in s:
              raise SystemExit('sales period child not found')
          s = s.replace(old_period_child, new_period_child, 1)

          old_payment_child = "        child: OutlinedButton.icon(onPressed: null, icon: const Icon(Icons.filter_alt_outlined, size: 17), label: Text(_paymentLabel())),"
          new_payment_child = "        child: _menuSurface(Icons.filter_alt_outlined, _paymentLabel()),"
          if old_payment_child not in s:
              raise SystemExit('sales payment child not found')
          s = s.replace(old_payment_child, new_payment_child, 1)

          payment_block = """      PopupMenuButton<_SalesPaymentFilter>(\n        onSelected: (value) => setState(() => _paymentFilter = value),\n        itemBuilder: (_) => const [\n          PopupMenuItem(value: _SalesPaymentFilter.all, child: Text('Todos')),\n          PopupMenuItem(value: _SalesPaymentFilter.cash, child: Text('Efectivo')),\n          PopupMenuItem(value: _SalesPaymentFilter.card, child: Text('Tarjeta')),\n          PopupMenuItem(value: _SalesPaymentFilter.transfer, child: Text('Transferencia')),\n          PopupMenuItem(value: _SalesPaymentFilter.credit, child: Text('Fiado')),\n        ],\n        child: _menuSurface(Icons.filter_alt_outlined, _paymentLabel()),\n      ),"""
          type_block = """      PopupMenuButton<_SalesTypeFilter>(\n        onSelected: (value) => setState(() => _typeFilter = value),\n        itemBuilder: (_) => const [\n          PopupMenuItem(value: _SalesTypeFilter.all, child: Text('Todas')),\n          PopupMenuItem(value: _SalesTypeFilter.products, child: Text('Productos')),\n          PopupMenuItem(value: _SalesTypeFilter.electronic, child: Text('Saldo electrónico')),\n        ],\n        child: _menuSurface(Icons.category_outlined, _typeLabel()),\n      ),\n"""
          if payment_block not in s:
              raise SystemExit('sales payment block not found')
          s = s.replace(payment_block, type_block + payment_block, 1)

          payment_label_marker = '  String _paymentLabel() {'
          type_label = """  String _typeLabel() {\n    switch (_typeFilter) {\n      case _SalesTypeFilter.all: return 'Todas';\n      case _SalesTypeFilter.products: return 'Productos';\n      case _SalesTypeFilter.electronic: return 'Saldo';\n    }\n  }\n\n  Widget _menuSurface(IconData icon, String label) {\n    return Container(\n      constraints: const BoxConstraints(minHeight: 42),\n      padding: const EdgeInsets.symmetric(horizontal: 12),\n      decoration: BoxDecoration(\n        color: AppColors.cardBackground,\n        borderRadius: BorderRadius.circular(10),\n        border: Border.all(color: AppColors.border),\n        boxShadow: const [BoxShadow(color: AppColors.shadowColor, blurRadius: 7, offset: Offset(0, 2))],\n      ),\n      child: Row(mainAxisSize: MainAxisSize.min, children: [\n        Icon(icon, size: 17, color: AppColors.textSecondary),\n        const SizedBox(width: 7),\n        Text(label, style: const TextStyle(fontSize: 12, fontWeight: FontWeight.w600, color: AppColors.textPrimary)),\n      ]),\n    );\n  }\n\n"""
          if payment_label_marker not in s:
              raise SystemExit('sales label marker not found')
          s = s.replace(payment_label_marker, type_label + payment_label_marker, 1)

          # Make the sales table header more visibly distinct.
          s = s.replace(
              "      padding: const EdgeInsets.fromLTRB(14, 9, 14, 8),",
              "      padding: const EdgeInsets.fromLTRB(14, 11, 14, 10),",
              1,
          )
          s = s.replace(
              "        color: AppColors.inputBackground,\n        borderRadius: BorderRadius.vertical(top: Radius.circular(AppDimensions.cardRadius)),",
              "        color: AppColors.inputBackground,\n        borderRadius: BorderRadius.vertical(top: Radius.circular(AppDimensions.cardRadius)),\n        boxShadow: const [BoxShadow(color: AppColors.shadowColor, blurRadius: 4, offset: Offset(0, 1))],",
              1,
          )
          write(path, s)

          # 3) Purchases: keep the existing header, add the same visual separation
          # and add an actual table/list header above the purchase cards.
          path = 'lib/presentation/purchases/purchases_layout_legacy.dart'
          s = read(path)
          s = s.replace(
              "      border: Border.all(color: AppColors.border),\n      ),\n      child: Row(\n        mainAxisSize: MainAxisSize.min,",
              "      border: Border.all(color: AppColors.border),\n      boxShadow: const [BoxShadow(color: AppColors.shadowColor, blurRadius: 7, offset: Offset(0, 2))],\n      ),\n      child: Row(\n        mainAxisSize: MainAxisSize.min,",
              1,
          )
          old_history = """          const SizedBox(height: 10),\n          Expanded(\n            child: purchases.isEmpty\n                ? const _EmptyState()"""
          new_history = """          const SizedBox(height: 10),\n          if (purchases.isNotEmpty) ...[\n            Container(\n              padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 9),\n              decoration: const BoxDecoration(\n                color: AppColors.inputBackground,\n                border: Border(bottom: BorderSide(color: AppColors.border)),\n                borderRadius: BorderRadius.vertical(top: Radius.circular(9)),\n              ),\n              child: const Row(\n                children: [\n                  SizedBox(width: 42),\n                  SizedBox(width: 10),\n                  Expanded(child: Text('Proveedor / factura', style: AppTextStyles.ticketLabel)),\n                  SizedBox(width: 100, child: Text('Total', textAlign: TextAlign.right, style: AppTextStyles.ticketLabel)),\n                  SizedBox(width: 76, child: Text('Pago', textAlign: TextAlign.right, style: AppTextStyles.ticketLabel)),\n                  SizedBox(width: 86, child: Text('Artículos', textAlign: TextAlign.right, style: AppTextStyles.ticketLabel)),\n                  SizedBox(width: 18),\n                ],\n              ),\n            ),\n            const SizedBox(height: 4),\n          ],\n          Expanded(\n            child: purchases.isEmpty\n                ? const _EmptyState()"""
          if old_history not in s:
              raise SystemExit('purchase history insertion marker not found')
          s = s.replace(old_history, new_history, 1)
          write(path, s)

          # 4) Inventory export button: remove disabled-looking child styling and
          # give both file actions a small elevation/shadow.
          path = 'lib/presentation/Inventory/inventory_layout_legacy.dart'
          s = read(path)
          s = s.replace(
              "      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(8)),\n    );",
              "      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(8)),\n      elevation: 1,\n      shadowColor: AppColors.shadowColor,\n    );",
              1,
          )
          old_export = """            child: OutlinedButton.icon(\n              onPressed: null,\n              style: buttonStyle,\n              icon: _isExporting\n                  ? const SizedBox(width: 16, height: 16, child: CircularProgressIndicator(strokeWidth: 2))\n                  : const Icon(Icons.download_outlined, size: 18),\n              label: const Text('Descargar inventario'),\n            ),"""
          new_export = """            child: Container(\n              padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 11),\n              decoration: BoxDecoration(\n                color: AppColors.cardBackground,\n                borderRadius: BorderRadius.circular(8),\n                border: Border.all(color: AppColors.border),\n                boxShadow: const [BoxShadow(color: AppColors.shadowColor, blurRadius: 6, offset: Offset(0, 2))],\n              ),\n              child: Row(mainAxisSize: MainAxisSize.min, children: [\n                _isExporting\n                    ? const SizedBox(width: 16, height: 16, child: CircularProgressIndicator(strokeWidth: 2))\n                    : const Icon(Icons.download_outlined, size: 18, color: AppColors.textPrimary),\n                const SizedBox(width: 8),\n                const Text('Descargar inventario', style: TextStyle(fontSize: 13, fontWeight: FontWeight.w600, color: AppColors.textPrimary)),\n              ]),\n            ),"""
          if old_export not in s:
              raise SystemExit('inventory export child not found')
          s = s.replace(old_export, new_export, 1)
          write(path, s)

          # Format the touched Dart files when Flutter/Dart is available on the runner.
          subprocess.run(['bash', '-lc', "command -v dart >/dev/null 2>&1 && dart format lib/presentation/electronic_balance/electronic_balance_layout.dart lib/presentation/sales/sales_layout.dart lib/presentation/purchases/purchases_layout_legacy.dart lib/presentation/Inventory/inventory_layout_legacy.dart || true"], check=False)

          # Remove this one-shot workflow from the same commit.
          Path('.github/workflows/fix_ui_and_electronic.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib .github/workflows/fix_ui_and_electronic.yml
          git commit -m "fix: polish sales purchases inventory and electronic balance UI"
          git push origin main
