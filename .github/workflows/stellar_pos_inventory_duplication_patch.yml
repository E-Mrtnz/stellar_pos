name: inventory-duplication-patch

on:
  push:
    branches:
      - feature/finalization

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'feat(inventory): add product duplication')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply duplication changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/presentation/Inventory/inventory_layout_legacy.dart')
          text = path.read_text()

          old_method = """  Future<void> _editProduct(Map<String, dynamic> product) =>
      CreateProductDialog.show(context, product: product);
"""
          new_method = """  Future<void> _editProduct(Map<String, dynamic> product) =>
      CreateProductDialog.show(context, product: product);

  Future<void> _duplicateProduct(Map<String, dynamic> product) async {
    final productName = ProductUtils.cleanName(product);
    final confirmed = await showDialog<bool>(
      context: context,
      builder: (dialogContext) => AlertDialog(
        backgroundColor: AppColors.cardBackground,
        title: const Text('Duplicar producto'),
        content: Text('¿Deseas duplicar "$productName"?'),
        actions: [
          TextButton(
            onPressed: () => Navigator.of(dialogContext).pop(false),
            child: const Text('Cancelar'),
          ),
          FilledButton.icon(
            onPressed: () => Navigator.of(dialogContext).pop(true),
            icon: const Icon(Icons.copy_outlined),
            label: const Text('Duplicar'),
          ),
        ],
      ),
    );
    if (confirmed != true || !mounted) return;

    final duplicate = Map<String, dynamic>.from(product)
      ..['id'] = ''
      ..['barcode'] = ''
      ..['stock'] = 0;

    await CreateProductDialog.show(context, product: duplicate);
  }
"""
          if old_method not in text:
              raise SystemExit('No se encontró el bloque _editProduct esperado.')
          text = text.replace(old_method, new_method, 1)

          old_row = """    return Column(
      children: [
        Padding(
          padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 6),
          child: Row(
"""
          new_row = """    return Column(
      children: [
        Material(
          color: Colors.transparent,
          child: InkWell(
            onLongPress: () => _duplicateProduct(product),
            child: Padding(
              padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 6),
              child: Row(
"""
          if old_row not in text:
              raise SystemExit('No se encontró el inicio de _buildInventoryRow esperado.')
          text = text.replace(old_row, new_row, 1)

          old_end = """              _textCell('$profitPercent%', 70),
            ],
          ),
        ),
        const Divider(height: 1, color: AppColors.chipBackground),
"""
          new_end = """                _textCell('$profitPercent%', 70),
              ],
            ),
          ),
        ),
        const Divider(height: 1, color: AppColors.chipBackground),
"""
          if old_end not in text:
              raise SystemExit('No se encontró el cierre de _buildInventoryRow esperado.')
          text = text.replace(old_end, new_end, 1)

          path.write_text(text)
          PY

      - name: Verify patch
        run: |
          grep -q "Future<void> _duplicateProduct" lib/presentation/Inventory/inventory_layout_legacy.dart
          grep -q "onLongPress: () => _duplicateProduct(product)" lib/presentation/Inventory/inventory_layout_legacy.dart
          grep -q "bool get _isEditing => widget.product != null &&" lib/presentation/Inventory/widgets/create_product_dialog.dart

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/presentation/Inventory/inventory_layout_legacy.dart
          git diff --cached --check
          git commit -m "feat(inventory): add product duplication"
          git push
