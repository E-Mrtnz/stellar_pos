name: Validate finance payment accounting

on:
  push:
    branches:
      - feature/sales-operations

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/sales-operations
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format
        run: dart format lib/core/models/debt.dart lib/core/domain/services/debt_service.dart lib/core/providers/debt_provider.dart lib/presentation/sales/sales_layout.dart test/core/models/debt_serialization_test.dart

      - name: Analyze
        run: dart analyze --no-fatal-warnings lib/core/models/debt.dart lib/core/domain/services/debt_service.dart lib/core/providers/debt_provider.dart lib/presentation/sales/sales_layout.dart

      - name: Test
        run: flutter test test/core/models/debt_serialization_test.dart test/core/services/domain/debt_service_test.dart

      - name: Commit formatted changes and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/validate-finance-fix.yml
          git add lib/core/models/debt.dart lib/core/domain/services/debt_service.dart lib/core/providers/debt_provider.dart lib/presentation/sales/sales_layout.dart test/core/models/debt_serialization_test.dart .github/workflows/validate-finance-fix.yml
          git commit -m "fix(finance): finalize payment accounting validation [finance-validation-done]"
          git push origin feature/sales-operations
