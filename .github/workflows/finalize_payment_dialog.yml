name: Finalize payment dialog

on:
  push:
    branches:
      - feature/finalization

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch purchase discounted price input
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/presentation/purchases/purchase_creation_dialog.dart')
          text = path.read_text()

          text = text.replace(
              "  late final TextEditingController _originalController;\n  late final TextEditingController _discountController;",
              "  late final TextEditingController _originalController;\n  late final TextEditingController _discountController;\n  late final TextEditingController _discountedController;",
          )

          text = text.replace(
              "    _discountController = TextEditingController(\n      text: item.discountPercent > 0\n          ? item.discountPercent.toStringAsFixed(2)\n          : '',\n    );\n    _ivaController",
              "    _discountController = TextEditingController(\n      text: item.discountPercent > 0\n          ? item.discountPercent.toStringAsFixed(2)\n          : '',\n    );\n    _discountedController = TextEditingController(\n      text: item.discountedPresentationPrice.toStringAsFixed(2),\n    );\n    _ivaController",
          )

          text = text.replace(
              "    if ((old.discountPercent - current.discountPercent).abs() > 0.0001)\n      _replace(\n        _discountController,\n        current.discountPercent > 0\n            ? current.discountPercent.toStringAsFixed(2)\n            : '',\n      );\n    if (old.ivaPerPresentation",
              "    if ((old.discountPercent - current.discountPercent).abs() > 0.0001)\n      _replace(\n        _discountController,\n        current.discountPercent > 0\n            ? current.discountPercent.toStringAsFixed(2)\n            : '',\n      );\n    if ((old.discountedPresentationPrice -\n                current.discountedPresentationPrice)\n            .abs() >\n        0.0001)\n      _replace(\n        _discountedController,\n        current.discountedPresentationPrice.toStringAsFixed(2),\n      );\n    if (old.ivaPerPresentation",
          )

          text = text.replace(
              "  void _recalculateFromDiscount() {\n    if (_updating) return;\n    final discount = _number(\n      _discountController,\n    ).clamp(0, 100).toDouble();\n    final original = _number(_originalController);\n    if (original <= 0) return;\n    _updating = true;\n    final discounted = original * (1 - discount / 100);\n    _updating = false;\n    widget.onChanged(\n      widget.item.copyWith(\n        discountedPresentationPrice: discounted,\n        discountPercent: discount,\n      ),\n    );\n  }",
              "  void _recalculateFromDiscount() {\n    if (_updating) return;\n    final discount = _number(\n      _discountController,\n    ).clamp(0, 100).toDouble();\n    final original = _number(_originalController);\n    if (original <= 0) return;\n    _updating = true;\n    final discounted = original * (1 - discount / 100);\n    _updating = false;\n    widget.onChanged(\n      widget.item.copyWith(\n        discountedPresentationPrice: discounted,\n        discountPercent: discount,\n      ),\n    );\n  }\n\n  void _recalculateFromDiscountedPrice() {\n    if (_updating) return;\n    final original = _number(_originalController);\n    if (original <= 0) return;\n    final discounted = _number(_discountedController)\n        .clamp(0, original)\n        .toDouble();\n    final discount = ((original - discounted) / original * 100)\n        .clamp(0, 100)\n        .toDouble();\n    _updating = true;\n    _replace(\n      _discountController,\n      discount > 0 ? discount.toStringAsFixed(2) : '',\n    );\n    _updating = false;\n    widget.onChanged(\n      widget.item.copyWith(\n        discountedPresentationPrice: discounted,\n        discountPercent: discount,\n      ),\n    );\n  }",
          )

          text = text.replace(
              "    _discountController.dispose();\n    _ivaController.dispose();",
              "    _discountController.dispose();\n    _discountedController.dispose();\n    _ivaController.dispose();",
          )

          old_widget = """                child: _readonly(\n                    'Con descuento',\n                    widget.money(item.discountedPresentationPrice),\n                    Icons.local_offer_outlined,\n                    color: AppColors.primary,\n                    filled: true,\n                  ),"""
          new_widget = """                child: _numberField(\n                    _discountedController,\n                    'Con descuento',\n                    Icons.local_offer_outlined,\n                    onChanged: _recalculateFromDiscountedPrice,\n                  ),"""
          if old_widget not in text:
              raise SystemExit('Con descuento widget marker not found')
          text = text.replace(old_widget, new_widget, 1)

          path.write_text(text)
          PY
      - name: Validate patch
        run: |
          grep -q "late final TextEditingController _discountedController;" lib/presentation/purchases/purchase_creation_dialog.dart
          grep -q "_recalculateFromDiscountedPrice" lib/presentation/purchases/purchase_creation_dialog.dart
          grep -q "'_discountedController" lib/presentation/purchases/purchase_creation_dialog.dart
      - name: Commit patched code and remove temporary workflow
        run: |
          git config user.name "E-Z"
          git config user.email "68935117+E-Mrtnz@users.noreply.github.com"
          git add lib/presentation/purchases/purchase_creation_dialog.dart
          git rm .github/workflows/finalize_payment_dialog.yml
          git commit -m "fix: enable discounted purchase price input"
          git push origin feature/finalization
