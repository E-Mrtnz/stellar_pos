name: Fix inventory panel
on:
  push:
    branches:
      - feature/finalization
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/finalization
          fetch-depth: 0
      - name: Patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('lib/presentation/Inventory/widgets/create_product_dialog.dart')
          text = path.read_text()

          marker = '              AnimatedPositioned(\n'
          start = text.index(marker)
          open_paren = text.index('(', start)
          depth = 0
          end_paren = None
          for i in range(open_paren, len(text)):
              if text[i] == '(':
                  depth += 1
              elif text[i] == ')':
                  depth -= 1
                  if depth == 0:
                      end_paren = i
                      break
          if end_paren is None:
              raise SystemExit('AnimatedPositioned no encontrado')
          block_end = end_paren + 2 if text[end_paren:end_paren + 2] == '),' else end_paren + 1
          block = text[start:block_end]
          text = text[:start] + text[block_end:]

          old_padding = 'padding: EdgeInsets.only(right: _stockExpanded ? 85 : 0),'
          new_padding = 'padding: EdgeInsets.only(right: _stockExpanded ? 155 : 34),'
          if old_padding not in text:
              raise SystemExit('Padding original no encontrado')
          text = text.replace(old_padding, new_padding, 1)

          padding_start = text.index('              Padding(\n')
          padding_open = text.index('(', padding_start)
          depth = 0
          padding_end_paren = None
          for i in range(padding_open, len(text)):
              if text[i] == '(':
                  depth += 1
              elif text[i] == ')':
                  depth -= 1
                  if depth == 0:
                      padding_end_paren = i
                      break
          if padding_end_paren is None:
              raise SystemExit('Padding principal no encontrado')
          padding_end = padding_end_paren + 2 if text[padding_end_paren:padding_end_paren + 2] == '),' else padding_end_paren + 1
          text = text[:padding_end] + '\n' + block + text[padding_end:]

          text = text.replace("              'stock físico',", "              'Stock físico',", 1)
          text = text.replace("              'mín',", "              'Mínimo',", 1)
          text = text.replace("              'máx',", "              'Máximo',", 1)
          text = text.replace("'Registrado: $registered'", "'Stock registrado: $registered'", 1)
          text = text.replace("'Físico: $physical'", "'Stock físico: $physical'", 1)

          path.write_text(text)
          PY
      - name: Format and analyze
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
      - run: dart format lib/presentation/Inventory/widgets/create_product_dialog.dart
      - run: flutter analyze --no-fatal-infos lib/presentation/Inventory/widgets/create_product_dialog.dart
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/presentation/Inventory/widgets/create_product_dialog.dart
          git rm .github/workflows/fix_inventory_panel.yml
          git commit -m 'fix: expose inventory panel in product dialog'
          git push origin feature/finalization
