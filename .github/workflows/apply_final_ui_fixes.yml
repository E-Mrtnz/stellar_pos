name: Apply final UI fixes

on:
  push:
    paths:
      - '.github/workflows/apply_final_ui_fixes.yml'
      - 'tools/apply_final_ui_fixes.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        run: python3 tools/apply_final_ui_fixes.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib
          git rm -f .github/workflows/apply_final_ui_fixes.yml tools/apply_final_ui_fixes.py
          git commit -m "fix: finalize sales purchases inventory and electronic balance UI"
          git push origin main
