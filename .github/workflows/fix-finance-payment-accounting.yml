name: Fix finance payment accounting

on:
  push:
    branches:
      - feature/sales-operations

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/sales-operations
          fetch-depth: 0

      - name: Apply fix
        run: python3 tool/finance_payment_fix.py

      - name: Add sale model import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/core/providers/debt_provider.dart')
          text = path.read_text()
          if "package:stellar_pos/core/models/sale.dart" not in text:
              text = text.replace(
                  "import 'package:stellar_pos/core/models/debt.dart';",
                  "import 'package:stellar_pos/core/models/debt.dart';\nimport 'package:stellar_pos/core/models/sale.dart';",
                  1,
              )
              path.write_text(text)
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format
        run: |
          dart format \
            lib/core/models/debt.dart \
            lib/core/domain/services/debt_service.dart \
            lib/core/providers/debt_provider.dart \
            lib/presentation/sales/sales_layout.dart \
            test/core/models/debt_serialization_test.dart

      - name: Analyze
        run: |
          dart analyze --no-fatal-warnings \
            lib/core/models/debt.dart \
            lib/core/domain/services/debt_service.dart \
            lib/core/providers/debt_provider.dart \
            lib/presentation/sales/sales_layout.dart

      - name: Test
        run: |
          flutter test \
            test/core/models/debt_serialization_test.dart \
            test/core/services/domain/debt_service_test.dart

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-finance-payment-accounting.yml tool/finance_payment_fix.py
          git add lib/core/models/debt.dart \
            lib/core/domain/services/debt_service.dart \
            lib/core/providers/debt_provider.dart \
            lib/presentation/sales/sales_layout.dart \
            test/core/models/debt_serialization_test.dart \
            .github/workflows/fix-finance-payment-accounting.yml \
            tool/finance_payment_fix.py
          git commit -m "fix(finance): ignore orphaned debt payments [finance-fix-done]"
          git push origin feature/sales-operations
