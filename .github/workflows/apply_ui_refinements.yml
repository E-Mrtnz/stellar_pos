name: Apply UI refinements

on:
  push:
    branches: [main]

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply refinements
        run: python tools/apply_ui_refinements.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply_ui_refinements.yml
          git rm -f tools/apply_ui_refinements.py
          git add lib
          git commit -m "fix: refine inventory, sales and settings UI"
          git push
