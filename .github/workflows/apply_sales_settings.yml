name: Apply sales settings integration

on:
  push:
    paths:
      - '.github/workflows/apply_sales_settings.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Integrate changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()
          def write(path, text):
              Path(path).write_text(text)

          # Constants: rename the selling screen and add the sales-history navigation slot.
          p = 'lib/core/constants/app_constants.dart'
          s = read(p)
          s = s.replace("static const String navHome = 'Ventas';", "static const String navHome = 'Punto de venta';\n  static const String navSales = 'Ventas';")
          old_nav = "static const int home = 0;\n  static const int electronicBalance = 1;\n  static const int purchases = 2;\n  static const int debts = 3;\n  static const int stats = 4;\n  static const int providers = 5;\n  static const int inventory = 6;\n  static const int settings = 7;"
          new_nav = "static const int home = 0;\n  static const int sales = 1;\n  static const int electronicBalance = 2;\n  static const int purchases = 3;\n  static const int debts = 4;\n  static const int stats = 5;\n  static const int providers = 6;\n  static const int inventory = 7;\n  static const int settings = 8;"
          if old_nav not in s: raise SystemExit('navigation constants not found')
          s = s.replace(old_nav, new_nav, 1)
          write(p, s)

          # Sidebar: add Ventas immediately below Punto de venta.
          p = 'lib/presentation/dashboard/widgets/sidebar_drawer.dart'
          s = read(p)
          needle = "                    _buildSidebarItem(\n                      AppNavigation.home,\n                      Icons.point_of_sale_rounded,\n                      AppStrings.navHome,\n                    ),"
          replacement = needle + "\n                    _buildSidebarItem(\n                      AppNavigation.sales,\n                      Icons.receipt_long_rounded,\n                      AppStrings.navSales,\n                    ),"
          if needle not in s: raise SystemExit('sidebar insertion point not found')
          write(p, s.replace(needle, replacement, 1))

          # Register general settings and the sales-history provider screen.
          p = 'lib/main.dart'
          s = read(p)
          imp = "import 'package:stellar_pos/core/providers/electronic_balance_provider.dart';"
          s = s.replace(imp, imp + "\nimport 'package:stellar_pos/core/providers/general_settings_provider.dart';", 1)
          s = s.replace("        ChangeNotifierProvider(create: (_) => PrinterProvider()),", "        ChangeNotifierProvider(create: (_) => PrinterProvider()),\n        ChangeNotifierProvider(create: (_) => GeneralSettingsProvider()),", 1)
          write(p, s)

          # Main dashboard routes the new history screen.
          p = 'lib/presentation/dashboard/main_dashboard_layout.dart'
          s = read(p)
          imp = "import 'package:stellar_pos/presentation/providers/providers_layout.dart';"
          s = s.replace(imp, imp + "\nimport 'package:stellar_pos/presentation/sales/sales_layout.dart';", 1)
          needle = "    if (_selectedNavIndex == AppNavigation.inventory) return const InventoryLayout();"
          if needle not in s: raise SystemExit('dashboard route point not found')
          s = s.replace(needle, "    if (_selectedNavIndex == AppNavigation.sales) return const SalesLayout();\n" + needle, 1)
          # Mark initial credit payment so it is not counted as a later debt payment.
          old = "          amount: initialCreditPayment,\n        );"
          new = "          amount: initialCreditPayment,\n          reference: sale.id,\n        );"
          if old not in s: raise SystemExit('initial credit payment call not found')
          s = s.replace(old, new, 1)
          write(p, s)

          # DebtProvider accepts the sale reference for the initial credit payment.
          p = 'lib/core/providers/debt_provider.dart'
          s = read(p)
          s = s.replace("    double? maxAmount,\n  })", "    double? maxAmount,\n    String? reference,\n  })", 1)
          target = "        createdAt: DateTime.now(),\n      ),"
          if target not in s: raise SystemExit('debt movement constructor not found')
          s = s.replace(target, "        createdAt: DateTime.now(),\n        reference: reference,\n      ),", 1)
          write(p, s)

          # Inventory import/export visibility follows General settings.
          p = 'lib/presentation/Inventory/inventory_layout.dart'
          s = read(p)
          imp = "import 'package:stellar_pos/core/providers/catalog_provider.dart';"
          s = s.replace(imp, imp + "\nimport 'package:stellar_pos/core/providers/general_settings_provider.dart';", 1)
          start = s.index('  Widget _buildFileActions() {')
          end = s.index('  Widget _buildInventoryTable', start)
          method = '''  Widget _buildFileActions() {\n    final settings = context.watch<GeneralSettingsProvider>();\n    if (!settings.showInventoryImport && !settings.showInventoryExport) {\n      return const SizedBox.shrink();\n    }\n\n    final buttonStyle = OutlinedButton.styleFrom(\n      foregroundColor: AppColors.textPrimary,\n      side: const BorderSide(color: AppColors.border),\n      padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 11),\n      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(8)),\n    );\n\n    return Row(\n      mainAxisAlignment: MainAxisAlignment.end,\n      children: [\n        if (settings.showInventoryImport)\n          OutlinedButton.icon(\n            onPressed: _isImporting || _isExporting ? null : _importInventory,\n            style: buttonStyle,\n            icon: _isImporting\n                ? const SizedBox(width: 16, height: 16, child: CircularProgressIndicator(strokeWidth: 2))\n                : const Icon(Icons.upload_file_outlined, size: 18),\n            label: const Text('Subir inventario'),\n          ),\n        if (settings.showInventoryImport && settings.showInventoryExport) const SizedBox(width: 8),\n        if (settings.showInventoryExport)\n          PopupMenuButton<String>(\n            enabled: !_isImporting && !_isExporting,\n            onSelected: (value) => value == 'excel' ? _exportExcel() : _exportPdf(),\n            itemBuilder: (context) => const [\n              PopupMenuItem<String>(value: 'excel', child: ListTile(dense: true, contentPadding: EdgeInsets.zero, leading: Icon(Icons.table_chart_outlined), title: Text('Descargar Excel'))),\n              PopupMenuItem<String>(value: 'pdf', child: ListTile(dense: true, contentPadding: EdgeInsets.zero, leading: Icon(Icons.picture_as_pdf_outlined), title: Text('Descargar PDF'))),\n            ],\n            child: OutlinedButton.icon(\n              onPressed: null,\n              style: buttonStyle,\n              icon: _isExporting\n                  ? const SizedBox(width: 16, height: 16, child: CircularProgressIndicator(strokeWidth: 2))\n                  : const Icon(Icons.download_outlined, size: 18),\n              label: const Text('Descargar inventario'),\n            ),\n          ),\n      ],\n    );\n  }\n\n'''
          s = s[:start] + method + s[end:]
          write(p, s)

          # Settings: add General beside Impresoras while preserving the existing printer UI.
          p = 'lib/presentation/settings/printer_settings_layout.dart'
          s = read(p)
          imp = "import 'package:stellar_pos/core/providers/printer_provider.dart';"
          s = s.replace(imp, imp + "\nimport 'package:stellar_pos/core/providers/general_settings_provider.dart';", 1)
          needle = "  late final List<_SettingsSection> _sections = [\n    _SettingsSection(\n      title: 'Impresoras',"
          replacement = "  late final List<_SettingsSection> _sections = [\n    _SettingsSection(\n      title: 'General',\n      icon: Icons.tune_outlined,\n      builder: (_) => const _GeneralSettingsContent(),\n    ),\n    _SettingsSection(\n      title: 'Impresoras',"
          if needle not in s: raise SystemExit('settings section list not found')
          s = s.replace(needle, replacement, 1)
          marker = 'class _PrinterSettingsContent extends StatefulWidget {'
          general = '''class _GeneralSettingsContent extends StatelessWidget {\n  const _GeneralSettingsContent();\n\n  @override\n  Widget build(BuildContext context) {\n    return Consumer<GeneralSettingsProvider>(\n      builder: (context, settings, _) => Padding(\n        padding: const EdgeInsets.all(AppDimensions.pagePadding),\n        child: Column(\n          crossAxisAlignment: CrossAxisAlignment.start,\n          children: [\n            const Text('Ajustes generales', style: AppTextStyles.brandTitle),\n            const SizedBox(height: 4),\n            const Text('Preferencias básicas de funcionamiento de Stellar POS.', style: TextStyle(fontSize: 12, color: AppColors.textSecondary)),\n            const SizedBox(height: 16),\n            Expanded(\n              child: SingleChildScrollView(\n                child: Container(\n                  padding: const EdgeInsets.all(16),\n                  decoration: BoxDecoration(\n                    color: AppColors.cardBackground,\n                    borderRadius: BorderRadius.circular(AppDimensions.largeCardRadius),\n                    border: Border.all(color: AppColors.border),\n                    boxShadow: const [BoxShadow(color: AppColors.shadowColor, blurRadius: 10, offset: Offset(0, 4))],\n                  ),\n                  child: Column(\n                    crossAxisAlignment: CrossAxisAlignment.start,\n                    children: [\n                      Row(children: [\n                        Container(width: 40, height: 40, decoration: BoxDecoration(color: AppColors.primary.withAlpha(20), borderRadius: BorderRadius.circular(10)), child: const Icon(Icons.inventory_2_outlined, color: AppColors.primary)),\n                        const SizedBox(width: 12),\n                        const Text('Inventario', style: AppTextStyles.sectionTitle),\n                      ]),\n                      const SizedBox(height: 14),\n                      _switchTile('Mostrar "Subir inventario"', 'Muestra la herramienta de importación en Inventario.', settings.showInventoryImport, settings.setShowInventoryImport),\n                      const SizedBox(height: 8),\n                      _switchTile('Mostrar "Descargar inventario"', 'Muestra las opciones para exportar el inventario.', settings.showInventoryExport, settings.setShowInventoryExport),\n                    ],\n                  ),\n                ),\n              ),\n            ),\n          ],\n        ),\n      ),\n    );\n  }\n\n  Widget _switchTile(String title, String subtitle, bool value, ValueChanged<bool> onChanged) {\n    return Container(\n      padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),\n      decoration: BoxDecoration(color: AppColors.inputBackground, borderRadius: BorderRadius.circular(10), border: Border.all(color: AppColors.border)),\n      child: Row(children: [\n        const Icon(Icons.settings_suggest_outlined, size: 19, color: AppColors.primary),\n        const SizedBox(width: 10),\n        Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [\n          Text(title, style: const TextStyle(fontSize: 12, fontWeight: FontWeight.w600, color: AppColors.textPrimary)),\n          const SizedBox(height: 2),\n          Text(subtitle, style: const TextStyle(fontSize: 10, color: AppColors.textSecondary)),\n        ])),\n        Switch(value: value, onChanged: onChanged, activeColor: AppColors.primary),\n      ]),\n    );\n  }\n}\n\n'''
          if marker not in s: raise SystemExit('printer content marker not found')
          s = s.replace(marker, general + marker, 1)
          write(p, s)

          # Remove this temporary workflow after applying all changes.
          Path('.github/workflows/apply_sales_settings.yml').unlink()

          import subprocess
          subprocess.run(['dart', 'format',
              'lib/core/constants/app_constants.dart',
              'lib/core/providers/debt_provider.dart',
              'lib/main.dart',
              'lib/presentation/dashboard/main_dashboard_layout.dart',
              'lib/presentation/dashboard/widgets/sidebar_drawer.dart',
              'lib/presentation/Inventory/inventory_layout.dart',
              'lib/presentation/settings/printer_settings_layout.dart',
              'lib/presentation/sales/sales_layout.dart',
              'lib/core/providers/general_settings_provider.dart'], check=False)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib .github/workflows/apply_sales_settings.yml
          git commit -m "feat: add sales history and general settings"
          git push origin main
