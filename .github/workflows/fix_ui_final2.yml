name: Repair final UI patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair Dart structure
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('lib/presentation/Inventory/inventory_layout_legacy.dart')
          s = p.read_text()
          start = s.find('class _InventoryActionButton extends StatelessWidget {')
          marker = s.find('  Widget _buildInventoryTable(List<Map<String, dynamic>> products) {')
          if start != -1 and marker != -1 and start < marker:
              helper = s[start:marker]
              s = s[:start] + s[marker:]
              s = s.rstrip() + '\n\n' + helper.strip() + '\n'
          unused = '''    final buttonStyle = OutlinedButton.styleFrom(\n      foregroundColor: AppColors.textPrimary,\n      side: const BorderSide(color: AppColors.border),\n      padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 11),\n      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(8)),\n      elevation: 1,\n      shadowColor: AppColors.shadowColor,\n    );\n\n'''
          s = s.replace(unused, '', 1)
          p.write_text(s)

          p = Path('lib/presentation/settings/printer_settings_layout.dart')
          s = p.read_text()
          imp = "import 'package:stellar_pos/presentation/widgets/settings_toggle_tile.dart';\n"
          if imp not in s:
              anchor = "import 'package:stellar_pos/core/providers/general_settings_provider.dart';\n"
              s = s.replace(anchor, anchor + imp, 1)
          p.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/presentation/Inventory/inventory_layout_legacy.dart lib/presentation/settings/printer_settings_layout.dart
          git rm .github/workflows/fix_ui_final2.yml
          git commit -m "fix: repair final UI patch structure" || exit 0
          git push
