name: Repair sales operations

on:
  push:
    branches:
      - feature/sales-operations

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current sales operations branch
        uses: actions/checkout@v4
        with:
          ref: feature/sales-operations
          fetch-depth: 0

      - name: Apply targeted fixes
        run: python tool/repair_sales_operations.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: dart format lib/presentation/dashboard/widgets/sale_detail_dialog.dart lib/presentation/sales/sales_layout.dart lib/presentation/dashboard/main_dashboard_layout.dart lib/presentation/debts/client_purchase_history_dialog.dart lib/presentation/widgets/app_alert.dart

      - name: Analyze changed files
        run: dart analyze lib/presentation/dashboard/widgets/sale_detail_dialog.dart lib/presentation/sales/sales_layout.dart lib/presentation/dashboard/main_dashboard_layout.dart lib/presentation/debts/client_purchase_history_dialog.dart lib/presentation/widgets/app_alert.dart

      - name: Commit fixes and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-sales-operations.yml tool/repair_sales_operations.py
          git add lib/presentation/dashboard/widgets/sale_detail_dialog.dart lib/presentation/sales/sales_layout.dart lib/presentation/dashboard/main_dashboard_layout.dart lib/presentation/debts/client_purchase_history_dialog.dart lib/presentation/widgets/app_alert.dart
          git commit -m "fix(sales): resolve sales operations compile errors"
          git push origin HEAD:feature/sales-operations
