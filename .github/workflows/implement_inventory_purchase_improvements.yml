name: Implement inventory and purchase improvements

on:
  push:
    branches: [feature/finalization]

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, 'apply inventory purchase improvements') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature/finalization
        uses: actions/checkout@v4
        with:
          ref: feature/finalization
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: false

      - name: Apply changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          def edit(path, replacements):
              p=Path(path); s=p.read_text()
              for old,new,label in replacements:
                  if old not in s: raise SystemExit(f'Missing target: {label}')
                  s=s.replace(old,new,1)
              p.write_text(s)

          edit('lib/core/models/product.dart', [
            ("  final int groupQuantity;\n  final double groupPrice;", "  final int groupQuantity;\n  final double groupPrice;\n  final int purchaseUnitsPerPresentation;", 'product field'),
            ("this.groupQuantity = 0, this.groupPrice = 0, SyncMetadata? metadata})", "this.groupQuantity = 0, this.groupPrice = 0, this.purchaseUnitsPerPresentation = 0, SyncMetadata? metadata})", 'product constructor'),
            ("double? groupPrice, SyncMetadata? metadata, bool touchMetadata = true})", "double? groupPrice, int? purchaseUnitsPerPresentation, SyncMetadata? metadata, bool touchMetadata = true})", 'copyWith signature'),
            ("      groupPrice: groupPrice ?? this.groupPrice,\n      metadata:", "      groupPrice: groupPrice ?? this.groupPrice,\n      purchaseUnitsPerPresentation: purchaseUnitsPerPresentation ?? this.purchaseUnitsPerPresentation,\n      metadata:", 'copyWith field'),
            ("'groupQuantity': groupQuantity, 'groupPrice': groupPrice, 'metadata': metadata.toMap()", "'groupQuantity': groupQuantity, 'groupPrice': groupPrice, 'purchaseUnitsPerPresentation': purchaseUnitsPerPresentation, 'metadata': metadata.toMap()", 'toMap'),
            ("groupQuantity: _int(map['groupQuantity']), groupPrice: _double(map['groupPrice']), metadata:", "groupQuantity: _int(map['groupQuantity']), groupPrice: _double(map['groupPrice']), purchaseUnitsPerPresentation: _int(map['purchaseUnitsPerPresentation']), metadata:", 'fromMap'),
          ])

          edit('lib/core/domain/services/inventory_stock_service.dart', [
            ("  bool canSell(Product product, int quantity) {", """  int adjustmentToPhysical(Product product, int physicalStock) {\n    if (physicalStock < 0) {\n      throw ArgumentError.value(physicalStock, 'physicalStock', 'No puede ser negativo.');\n    }\n    return physicalStock - product.stock;\n  }\n\n  Product adjustToPhysical(Product product, int physicalStock) {\n    final adjustment = adjustmentToPhysical(product, physicalStock);\n    if (adjustment == 0) return product;\n    return product.copyWith(stock: product.stock + adjustment, touchMetadata: true);\n  }\n\n  bool canSell(Product product, int quantity) {""", 'stock service')
          ])

          edit('lib/core/providers/product_provider.dart', [
            ("import 'package:stellar_pos/core/domain/catalog/catalog_registrar.dart';\n", "import 'package:stellar_pos/core/domain/catalog/catalog_registrar.dart';\nimport 'package:stellar_pos/core/domain/services/inventory_stock_service.dart';\n", 'provider import'),
            ("  final Repository<Product>? _repository;\n", "  final Repository<Product>? _repository;\n  static const _inventoryStockService = InventoryStockService();\n", 'provider service'),
            ("  /// Renames a catalog reference across every in-memory product and persists\n", """  bool updateStockToPhysical(String id, int physicalStock) {\n    final index = _products.indexWhere((item) => item.id == id);\n    if (index < 0 || physicalStock < 0) return false;\n    final current = _products[index];\n    final updated = _inventoryStockService.adjustToPhysical(current, physicalStock);\n    if (identical(updated, current)) return true;\n    _products[index] = updated;\n    notifyListeners();\n    _persist(() => _repository?.save(updated));\n    return true;\n  }\n\n  /// Renames a catalog reference across every in-memory product and persists\n""", 'provider physical update')
          ])

          edit('lib/presentation/Inventory/widgets/create_product_dialog.dart', [
            ("  bool _hasGroupPricing = false;\n  bool _groupExpanded = false;", "  bool _hasGroupPricing = false;\n  bool _groupExpanded = false;\n  bool _stockExpanded = false;\n  int _registeredStock = 0;", 'editor state'),
            ("    _stock = _readInt(p?['stock']); _minStock = _readInt(p?['minStock']); _maxStock = _readInt(p?['maxStock']);", "    _stock = _readInt(p?['stock']); _registeredStock = _stock; _minStock = _readInt(p?['minStock']); _maxStock = _readInt(p?['maxStock']);", 'registered stock'),
            ("    final product = Product(\n      id: widget.product?['id']?.toString() ?? '', name: _nameController.text.trim(), unit: _unitController.text.trim(), department: _selectedDistributor ?? '', brand: _selectedBrand ?? '',\n      cost: _price(_buyPriceController.text), price: _price(_sellPriceController.text), stock: _readInt(_stockController.text), minStock:", "    final physicalStock = _readInt(_stockController.text);\n    final product = Product(\n      id: widget.product?['id']?.toString() ?? '', name: _nameController.text.trim(), unit: _unitController.text.trim(), department: _selectedDistributor ?? '', brand: _selectedBrand ?? '',\n      cost: _price(_buyPriceController.text), price: _price(_sellPriceController.text), stock: physicalStock, minStock:", 'physical stock'),
            ("      final updated = provider.updateProduct(product);\n      if (!updated) {", "      final updated = provider.updateProduct(product.copyWith(stock: _registeredStock));\n      if (!updated) {", 'edit product stock'),
            ("        return;\n      }\n      AppAlert.show(context, 'El producto se actualizó correctamente.'", "        return;\n      }\n      if (!provider.updateStockToPhysical(product.id, physicalStock)) {\n        AppAlert.show(context, 'No se pudo actualizar el inventario físico.', title: 'No se pudo guardar', type: AppAlertType.warning);\n        return;\n      }\n      AppAlert.show(context, 'El producto se actualizó correctamente.'", 'apply physical adjustment'),
          ])

          p=Path('lib/presentation/Inventory/widgets/create_product_dialog.dart'); s=p.read_text()
          old="""    return Center(child: SingleChildScrollView(child: SizedBox(width: 480, child: Stack(clipBehavior: Clip.none, children: [\n      Positioned(top: 0, bottom: 0, right: 0, width: 155, child: Container(\n        decoration: const BoxDecoration(color: Color(0xFF3B82F6), borderRadius: BorderRadius.only(topRight: Radius.circular(20), bottomRight: Radius.circular(20))),\n        padding: const EdgeInsets.only(left: 70, right: 8, top: 12, bottom: 12),\n        child: Column(mainAxisAlignment: MainAxisAlignment.spaceEvenly, children: [\n          _counter('stock', _stockController, _stockFocusNode, () => _updateStock(_currentValue(_stockController, _stock) + 1), () => _updateStock(_currentValue(_stockController, _stock) - 1), (value) { _stock = _readInt(value); _clearError('stock'); }, _invalid('stock')),\n          _counter('mín', _minStockController, _minStockFocusNode, () => _updateMinStock(_currentValue(_minStockController, _minStock) + 1), () => _updateMinStock(_currentValue(_minStockController, _minStock) - 1), (value) { _minStock = _readInt(value); _clearError('minStock'); }, _invalid('minStock')),\n          _counter('máx', _maxStockController, _maxStockFocusNode, () => _updateMaxStock(_currentValue(_maxStockController, _maxStock) + 1), () => _updateMaxStock(_currentValue(_maxStockController, _maxStock) - 1), (value) { _maxStock = _readInt(value); _clearError('maxStock'); }, _invalid('maxStock')),\n        ]),\n      )),\n      Padding(padding: const EdgeInsets.only(right: 85), child: Column(mainAxisSize: MainAxisSize.min, children: [\n"""
          new="""    final adjustment = _stock - _registeredStock;\n    return Center(child: SingleChildScrollView(child: SizedBox(width: 480, child: Stack(clipBehavior: Clip.none, children: [\n      AnimatedPositioned(duration: const Duration(milliseconds: 180), curve: Curves.easeOut, top: 0, bottom: 0, right: 0, width: _stockExpanded ? 155 : 34, child: Container(\n        decoration: const BoxDecoration(color: Color(0xFF3B82F6), borderRadius: BorderRadius.only(topRight: Radius.circular(20), bottomRight: Radius.circular(20))),\n        padding: EdgeInsets.only(left: _stockExpanded ? 70 : 4, right: 4, top: 12, bottom: 12),\n        child: _stockExpanded\n            ? Column(mainAxisAlignment: MainAxisAlignment.spaceEvenly, children: [\n                _stockSummary(_registeredStock, _stock, adjustment),\n                _counter('stock físico', _stockController, _stockFocusNode, () => _updateStock(_currentValue(_stockController, _stock) + 1), () => _updateStock(_currentValue(_stockController, _stock) - 1), (value) { _stock = _readInt(value); _clearError('stock'); }, _invalid('stock')),\n                _counter('mín', _minStockController, _minStockFocusNode, () => _updateMinStock(_currentValue(_minStockController, _minStock) + 1), () => _updateMinStock(_currentValue(_minStockController, _minStock) - 1), (value) { _minStock = _readInt(value); _clearError('minStock'); }, _invalid('minStock')),\n                _counter('máx', _maxStockController, _maxStockFocusNode, () => _updateMaxStock(_currentValue(_maxStockController, _maxStock) + 1), () => _updateMaxStock(_currentValue(_maxStockController, _maxStock) - 1), (value) { _maxStock = _readInt(value); _clearError('maxStock'); }, _invalid('maxStock')),\n                InkWell(onTap: () => setState(() => _stockExpanded = false), child: const Icon(Icons.keyboard_arrow_right_rounded, color: Colors.white, size: 22)),\n              ])\n            : Center(child: IconButton(tooltip: 'Mostrar inventario', onPressed: () => setState(() => _stockExpanded = true), icon: const Icon(Icons.keyboard_arrow_left_rounded, color: Colors.white, size: 21))),\n      )),\n      Padding(padding: EdgeInsets.only(right: _stockExpanded ? 85 : 0), child: Column(mainAxisSize: MainAxisSize.min, children: [\n"""
          if old not in s: raise SystemExit('Missing target: fixed inventory panel')
          s=s.replace(old,new,1)
          anchor="  Widget _counter(String label, TextEditingController controller, FocusNode node, VoidCallback inc, VoidCallback dec, ValueChanged<String> changed, bool invalid)"
          summary="""  Widget _stockSummary(int registered, int physical, int adjustment) => Container(width: double.infinity, padding: const EdgeInsets.symmetric(horizontal: 7, vertical: 6), decoration: BoxDecoration(color: Colors.white.withOpacity(0.10), borderRadius: BorderRadius.circular(9), border: Border.all(color: Colors.white.withOpacity(0.25))), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [const Text('INVENTARIO', style: TextStyle(color: Colors.white, fontSize: 9, fontWeight: FontWeight.w800)), const SizedBox(height: 4), Text('Registrado: $registered', style: const TextStyle(color: Colors.white70, fontSize: 9)), Text('Físico: $physical', style: const TextStyle(color: Colors.white, fontSize: 10, fontWeight: FontWeight.w800)), Text('Ajuste: ${adjustment >= 0 ? '+' : ''}$adjustment', style: const TextStyle(color: Colors.white, fontSize: 9, fontWeight: FontWeight.w800)), Text('Nuevo stock: $physical', style: const TextStyle(color: Colors.white, fontSize: 10, fontWeight: FontWeight.w900))]));\n\n"""
          if anchor not in s: raise SystemExit('Missing target: counter helper')
          s=s.replace(anchor,summary+anchor,1); p.write_text(s)

          p=Path('lib/presentation/purchases/purchase_creation_dialog.dart'); s=p.read_text()
          def rep(old,new,label):
              nonlocal s
              if old not in s: raise SystemExit(f'Missing target: {label}')
              s=s.replace(old,new,1)
          rep("""        _items.add(\n          _DraftPurchaseItem(\n            product: product,\n            purchasedQuantity: 1,\n            bonusQuantity: 0,\n            unitsPerPresentation: 1,\n            originalPresentationPrice: product.cost,\n""", """        final rememberedUnits = product.purchaseUnitsPerPresentation;\n        final hasRememberedPresentation = rememberedUnits > 0;\n        _items.add(\n          _DraftPurchaseItem(\n            product: product,\n            purchasedQuantity: hasRememberedPresentation ? 1 : 0,\n            bonusQuantity: 0,\n            unitsPerPresentation: hasRememberedPresentation ? rememberedUnits : 0,\n            originalPresentationPrice: product.cost,\n""", 'remembered purchase defaults')
          rep("        final old = oldItems[item.product.id];\n        final unitCost = item.unitCost;\n", """        final old = oldItems[item.product.id];\n        final unitCost = item.unitCost;\n        if (item.unitsPerPresentation > 0 && current.purchaseUnitsPerPresentation != item.unitsPerPresentation) {\n          productProvider.updateProduct(current.copyWith(purchaseUnitsPerPresentation: item.unitsPerPresentation));\n        }\n""", 'persist presentation')
          rep("  bool _originalAutofilled = false;\n  bool _discountedAutofilled = false;", "  bool _originalAutofilled = false;\n  bool _discountedAutofilled = false;\n  bool _purchasedAutofilled = false;\n  bool _presentationAutofilled = false;", 'autofill flags')
          rep("""    final item = widget.item;\n    _purchasedController = TextEditingController(\n      text: widget.useDefaultHints ? '' : '${item.purchasedQuantity}',\n    );""", """    final item = widget.item;\n    final rememberedPresentation = item.product.purchaseUnitsPerPresentation > 0;\n    _purchasedAutofilled = widget.useDefaultHints && rememberedPresentation;\n    _presentationAutofilled = widget.useDefaultHints && rememberedPresentation;\n    _purchasedController = TextEditingController(\n      text: widget.useDefaultHints ? (rememberedPresentation ? '1' : '') : '${item.purchasedQuantity}',\n    );""", 'quantity defaults')
          rep("""    _presentationController = TextEditingController(\n      text: widget.useDefaultHints ? '' : '${item.unitsPerPresentation}',\n    );""", """    _presentationController = TextEditingController(\n      text: widget.useDefaultHints ? (rememberedPresentation ? '${item.product.purchaseUnitsPerPresentation}' : '') : '${item.unitsPerPresentation}',\n    );""", 'presentation default')
          for a,b in [("'Compradas'","'Fardos'"),("'Unid./present.'","'Unid. por fardo'"),("'Sin descuento'","'Precio sin desc.'"),("'Desc. %'","'Descuento %'"),("'Con descuento'","'Precio con desc.'"),("'Nuevo precio'","'Precio de venta'")]: s=s.replace(a,b)
          rep("""                    hint: '0',\n                  ),\n                ),\n                const SizedBox(width: 4),\n                Expanded(\n                  child: _quantityField(\n                    _bonusController,""", """                    hint: '0',\n                    autoFilled: _purchasedAutofilled,\n                  ),\n                ),\n                const SizedBox(width: 4),\n                Expanded(\n                  child: _quantityField(\n                    _bonusController,""", 'fardo feedback')
          rep("""                    _presentationController,\n                    'Unid. por fardo',\n                    Icons.inventory_2_outlined,\n                    hint: '0',\n""", """                    _presentationController,\n                    'Unid. por fardo',\n                    Icons.inventory_2_outlined,\n                    hint: '0',\n                    autoFilled: _presentationAutofilled,\n""", 'presentation feedback')
          rep("""    String? hint,\n  }) => _fieldBox(\n    label,\n    icon,\n    Row(\n""", """    String? hint,\n    bool autoFilled = false,\n  }) => _fieldBox(\n    label,\n    icon,\n    Row(\n""", 'quantity helper signature')
          rep("            onChanged: (_) => _emit(),", """            onChanged: (_) {\n              if (controller == _purchasedController) _purchasedAutofilled = false;\n              if (controller == _presentationController) _presentationAutofilled = false;\n              _emit();\n            },""", 'quantity manual feedback')
          rep("""      ],\n    ),\n  );\n\n  Widget _stepButton""", """      ],\n    ),\n    color: autoFilled ? AppColors.successGreen.withAlpha(12) : null,\n    autoFilled: autoFilled,\n  );\n\n  Widget _stepButton""", 'quantity auto style')
          p.write_text(s)

          t=Path('test/core/services/domain/inventory_stock_service_test.dart')
          t.parent.mkdir(parents=True, exist_ok=True)
          t.write_text("""import 'package:flutter_test/flutter_test.dart';\nimport 'package:stellar_pos/core/domain/services/inventory_stock_service.dart';\nimport 'package:stellar_pos/core/models/product.dart';\n\nvoid main() {\n  const service = InventoryStockService();\n  Product product(int stock) => Product(id: 'p', name: 'P', unit: 'u', department: '', cost: 1, price: 2, stock: stock, minStock: 0, maxStock: 100, category: '', barcode: '1');\n  test('reconciles negative registered stock with physical count', () {\n    final p = product(-3);\n    expect(service.adjustmentToPhysical(p, 5), 8);\n    expect(service.adjustToPhysical(p, 5).stock, 5);\n  });\n  test('reconciles a lower physical count', () {\n    final p = product(10);\n    expect(service.adjustmentToPhysical(p, 7), -3);\n    expect(service.adjustToPhysical(p, 7).stock, 7);\n  });\n}\n""")
          PY

      - name: Validate formatting and tests
        run: |
          dart format lib/core/models/product.dart lib/core/domain/services/inventory_stock_service.dart lib/core/providers/product_provider.dart lib/presentation/Inventory/widgets/create_product_dialog.dart lib/presentation/purchases/purchase_creation_dialog.dart test/core/services/domain/inventory_stock_service_test.dart
          flutter test test/core/services/domain/inventory_stock_service_test.dart
          flutter analyze lib/core/models/product.dart lib/core/domain/services/inventory_stock_service.dart lib/core/providers/product_provider.dart lib/presentation/Inventory/widgets/create_product_dialog.dart lib/presentation/purchases/purchase_creation_dialog.dart

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/implement_inventory_purchase_improvements.yml
          git add lib/core/models/product.dart lib/core/domain/services/inventory_stock_service.dart lib/core/providers/product_provider.dart lib/presentation/Inventory/widgets/create_product_dialog.dart lib/presentation/purchases/purchase_creation_dialog.dart test/core/services/domain/inventory_stock_service_test.dart
          git commit -m "fix: apply inventory purchase improvements"
          git push origin HEAD:feature/finalization
