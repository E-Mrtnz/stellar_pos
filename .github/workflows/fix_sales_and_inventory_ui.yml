name: Fix sales and inventory UI

on:
  push:
    branches:
      - feature/finalization

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/finalization
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.0
          channel: stable
          architecture: X64
          cache: false

      - name: Apply UI changes
        run: |
          python3 <<'PY'
          from pathlib import Path

          inv = Path('lib/presentation/Inventory/widgets/create_product_dialog.dart')
          text = inv.read_text()

          old = """        child: SizedBox(\n          width: 480,\n          child: Stack(\n            clipBehavior: Clip.none,\n            children: [\n              Column("""
          new = """        child: SizedBox(\n          width: 790,\n          child: Stack(\n            clipBehavior: Clip.none,\n            children: [\n              Transform.translate(\n                offset: const Offset(155, 0),\n                child: Column("""
          if old not in text:
              raise SystemExit('No se encontró el contenedor de la card de inventario')
          text = text.replace(old, new, 1)

          old = """              ),\n              AnimatedPositioned(\n                duration: const Duration(milliseconds: 180),\n                curve: Curves.easeOut,\n                top: 0,\n                bottom: 0,\n                right: _stockExpanded ? -155 : -34,\n                width: _stockExpanded ? 155 : 34,"""
          new = """                ),\n              ),\n              AnimatedPositioned(\n                duration: const Duration(milliseconds: 180),\n                curve: Curves.easeOut,\n                top: 0,\n                bottom: 0,\n                left: 635,\n                width: _stockExpanded ? 155 : 34,"""
          if old not in text:
              raise SystemExit('No se encontró la solapa de inventario')
          text = text.replace(old, new, 1)
          inv.write_text(text)

          sales = Path('lib/presentation/sales/sales_layout.dart')
          text = sales.read_text()

          old = """      final laterPayments = _laterPayments(\n        salesProvider.sales,\n        debtProvider.movements,\n        range,\n      );\n      final profit = sales.fold(0.0, (sum, sale) => sum + sale.effectiveProfit);"""
          new = """      final laterPayments = _laterPayments(\n        salesProvider.sales,\n        debtProvider.movements,\n        range,\n      );\n      final cashIn = collected + laterPayments;\n      final profit = sales.fold(0.0, (sum, sale) => sum + sale.effectiveProfit);"""
          if old not in text:
              raise SystemExit('No se encontró el cálculo de abonos/ganancia')
          text = text.replace(old, new, 1)

          old = """        PeriodSummaryMetric(\n          'Abonos cobrados',\n          _money(laterPayments),\n          valueColor: AppColors.warningOrange,\n        ),\n        PeriodSummaryMetric('Cantidad de ventas', '${sales.length}'),"""
          new = """        PeriodSummaryMetric(\n          'Abonos cobrados',\n          _money(laterPayments),\n          valueColor: AppColors.warningOrange,\n        ),\n        PeriodSummaryMetric(\n          'Total cobrado',\n          _money(cashIn),\n          valueColor: AppColors.successGreen,\n        ),\n        PeriodSummaryMetric(\n          'Ganancia estimada',\n          _money(profit),\n          valueColor: AppColors.successGreen,\n        ),\n        PeriodSummaryMetric('Cantidad de ventas', '${sales.length}'),"""
          if old not in text:
              raise SystemExit('No se encontró la lista del resumen del período')
          text = text.replace(old, new, 1)

          text = text.replace(
              "_buildMetrics(totalSold, collected, credit, laterPayments)",
              "_buildMetrics(totalSold, collected, credit, laterPayments, cashIn)",
              1,
          )

          old = """            const SizedBox(height: 7),\n            Row(\n              children: [\n                Text(\n                  '${sales.length} venta${sales.length == 1 ? '' : 's'} en ${_periodLabel()}',\n                  style: const TextStyle(\n                    fontSize: 10,\n                    color: AppColors.textSecondary,\n                  ),\n                ),\n                const Spacer(),\n                Text(\n                  'Ganancia estimada: ${_money(profit)}',\n                  style: const TextStyle(\n                    fontSize: 11,\n                    fontWeight: FontWeight.w700,\n                    color: AppColors.successGreen,\n                  ),\n                ),\n              ],\n            ),"""
          new = """            const SizedBox(height: 7),\n            Text(\n              '${sales.length} venta${sales.length == 1 ? '' : 's'} en ${_periodLabel()}',\n              style: const TextStyle(\n                fontSize: 10,\n                color: AppColors.textSecondary,\n              ),\n            ),"""
          if old not in text:
              raise SystemExit('No se encontró la ganancia inferior')
          text = text.replace(old, new, 1)

          old = """  Widget _buildMetrics(\n    double sold,\n    double collected,\n    double credit,\n    double laterPayments,\n  ) => Row("""
          new = """  Widget _buildMetrics(\n    double sold,\n    double collected,\n    double credit,\n    double laterPayments,\n    double cashIn,\n  ) => Row("""
          if old not in text:
              raise SystemExit('No se encontró la firma de tarjetas superiores')
          text = text.replace(old, new, 1)

          old = """      Expanded(\n        child: _metric(\n          'Abonos cobrados',\n          laterPayments,\n          Icons.savings_outlined,\n          AppColors.warningOrange,\n        ),\n      ),\n    ],\n  );"""
          new = """      Expanded(\n        child: _metric(\n          'Abonos cobrados',\n          laterPayments,\n          Icons.savings_outlined,\n          AppColors.warningOrange,\n        ),\n      ),\n      const SizedBox(width: 8),\n      Expanded(\n        child: _metric(\n          'En caja',\n          cashIn,\n          Icons.account_balance_wallet_outlined,\n          AppColors.successGreen,\n        ),\n      ),\n    ],\n  );"""
          if old not in text:
              raise SystemExit('No se encontró la última tarjeta superior')
          text = text.replace(old, new, 1)

          text = text.replace("'Fiado generado',", "'Fiado',", 1)
          sales.write_text(text)
          PY

      - name: Format and analyze
        run: |
          dart format lib/presentation/Inventory/widgets/create_product_dialog.dart lib/presentation/sales/sales_layout.dart
          flutter analyze --no-fatal-infos lib/presentation/Inventory/widgets/create_product_dialog.dart lib/presentation/sales/sales_layout.dart

      - name: Commit changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/presentation/Inventory/widgets/create_product_dialog.dart lib/presentation/sales/sales_layout.dart .github/workflows/fix_sales_and_inventory_ui.yml
          git commit -m "fix: refine inventory tab and sales totals"
          git rm .github/workflows/fix_sales_and_inventory_ui.yml
          git commit -m "chore: remove temporary UI workflow"
          git push origin HEAD:feature/finalization
